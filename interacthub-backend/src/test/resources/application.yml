spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

app:
  jwt:
    secret: defaultSecretKeyThatShouldBeChangedInProductionAndMustBeLongEnoughForHS256Algorithm
    expiration-ms: 86400000
    refresh-expiration-ms: 604800000
  rate-limit:
    enabled: true
    capacity: 100
    window-seconds: 60
  cloudinary:
    cloud-name: demo
    api-key: key
    api-secret: secret
  seed:
    admin-email: admin@interacthub.com
    admin-password: Admin@123
  redis:
    stream:
      enabled: false
