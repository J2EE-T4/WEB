spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:interacthub}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    open-in-view: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 3000ms
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

app:
  jwt:
    secret: ${JWT_SECRET:defaultSecretKeyThatShouldBeChangedInProductionAndMustBeLongEnoughForHS256Algorithm}
    expiration-ms: 86400000 # 24 hours
    refresh-expiration-ms: 604800000 # 7 days
  rate-limit:
    enabled: true
    capacity: 100
    window-seconds: 60
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME:demo}
    api-key: ${CLOUDINARY_API_KEY:key}
    api-secret: ${CLOUDINARY_API_SECRET:secret}
  seed:
    admin-email: admin@interacthub.com
    admin-password: ${ADMIN_PASSWORD:Admin@123}
  redis:
    stream:
      enabled: ${REDIS_STREAM_ENABLED:true}
      stream-key: "interacthub:notifications:stream"
      group-name: "interacthub-workers"

server:
  port: 8080
