# docker-compose.yml — Dành cho phát triển local (dev only)
# Chỉ khởi động các service hạ tầng (PostgreSQL, Redis).
# Spring Boot app vẫn chạy bình thường bằng: mvn spring-boot:run
#
# Cách dùng:
#   docker compose up -d          # Khởi động ngầm
#   docker compose down           # Dừng và xóa containers
#   docker compose down -v        # Dừng và xóa cả volumes (xóa sạch data)

services:

  # ── PostgreSQL ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: interacthub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-interacthub}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: interacthub-redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    command: >-
      sh -c 'if [ -n "$$REDIS_PASSWORD" ]; then
        exec redis-server --save 60 1 --loglevel warning --requirepass "$$REDIS_PASSWORD";
      else
        exec redis-server --save 60 1 --loglevel warning;
      fi'
    healthcheck:
      test: ["CMD-SHELL", "if [ -n \"$$REDIS_PASSWORD\" ]; then REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping; else redis-cli ping; fi"]
      interval: 10s
      timeout: 5s
      retries: 5

# ── Volumes ─────────────────────────────────────────────────────────────────
volumes:
  postgres-data:
    name: interacthub-postgres-data
  redis-data:
    name: interacthub-redis-data
